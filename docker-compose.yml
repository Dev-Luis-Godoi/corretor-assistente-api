services:
  postgres:
    image: postgres:17
    container_name: corretor-assistente-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: corretor
      POSTGRES_PASSWORD: corretor
      POSTGRES_DB: corretor_assistente
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
